<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War of Blocks">
<meta name="theme-color" content="#8FD0F5">
<meta name="format-detection" content="telephone=no">
<title>War of Blocks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/pixelify-sans-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelify-sans-700-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Pixelify Sans (SIL OFL 1.1, fonts/OFL.txt) — çevrimdışı çalışsın diye repo içinde */
  @font-face {
    font-family: 'Pixelify Sans'; font-style: normal; font-weight: 700; font-display: swap;
    src: url(fonts/pixelify-sans-700-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Pixelify Sans'; font-style: normal; font-weight: 700; font-display: swap;
    src: url(fonts/pixelify-sans-700-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #BCE3F9;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 5;
    background: #8FD0F5; color: #1E2233;
    flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    font: 700 26px "Pixelify Sans", ui-monospace, Menlo, monospace; text-align: center;
  }
  #rotate .phone {
    width: 56px; height: 96px; box-sizing: border-box;
    border: 8px solid #1E2233; background: #FFFFFF;
    box-shadow: 6px 6px 0 #1E2233;
    animation: turn 2.2s ease-in-out infinite;
  }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" aria-label="War of Blocks oyunu"></canvas></div>
  <div id="rotate"><div class="phone"></div><div>Telefonu yan çevir</div></div>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
